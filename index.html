<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1f2937">
<meta name="robots" content="noindex, nofollow">
<title>Recruitment</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706;--radius:14px;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;padding-bottom:40px;}
  header.appbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  header.appbar h1{font-size:17px;margin:0;font-weight:600;flex:1}
  .iconbtn{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer;}
  .langsw{display:flex;gap:2px;background:rgba(255,255,255,.15);border-radius:10px;padding:2px;flex:none}
  .langsw button{border:none;background:transparent;color:rgba(255,255,255,.7);font-size:12px;font-weight:700;padding:6px 9px;border-radius:8px;cursor:pointer}
  .langsw button.on{background:#fff;color:var(--ink)}
  .wrap{max-width:980px;margin:0 auto;padding:16px}
  .appfooter{text-align:center;color:var(--muted);font-size:11px;padding:6px 16px 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
  select,input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=tel],input[type=search],textarea{width:100%;padding:12px;font-size:16px;border:1px solid #cbd2dc;border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
  input[type=file]{width:100%;padding:10px;font-size:14px;border:1px dashed #cbd2dc;border-radius:10px;background:#f9fafb}
  textarea{min-height:80px;resize:vertical}
  .row{margin-bottom:14px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){.two{grid-template-columns:1fr;gap:0}}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:12px;cursor:pointer;background:var(--accent);color:#fff;font-family:inherit}
  .btn:active{transform:translateY(1px)}
  .btn.proceed{background:#22aa96}
  .btn.cancel{background:#9b0a0a}
  .btn.add{background:#f26f21}
  .btn.brown{background:#3b2314}
  .btn.grey{background:#e5e7eb;color:var(--ink)}
  .btn.outline{background:#fff;color:var(--ink);border:1px solid #cbd2dc}
  .btn.outline.red{color:#9b0a0a;border-color:#e8b4b4}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn.small{width:auto;padding:9px 14px;font-size:14px}
  .hide{display:none !important}
  .muted{color:var(--muted)}
  .msg{font-size:14px;margin-top:10px;min-height:1em}
  .msg.err{color:var(--red)} .msg.ok{color:var(--green)}
  h2.section{font-size:18px;margin:0 0 14px}

  /* list */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .toolbar input[type=search]{flex:1 1 220px;width:auto;padding:10px 12px;font-size:15px}
  .toolbar select{flex:0 1 190px;width:auto;padding:10px 12px;font-size:15px}
  @media (max-width:560px){.toolbar select{flex:1 1 40%}.toolbar .btn{flex:1 1 40%}}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
  .chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip b{margin-left:5px;opacity:.7}
  .list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .lrow{display:grid;grid-template-columns:2fr 1.1fr 1.2fr auto;gap:10px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
  .lrow:first-child{border-top:0}
  .lrow:hover{background:#f9fafb}
  .sub{color:var(--muted);font-size:13px}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  @media (max-width:720px){.lrow{grid-template-columns:1fr auto}.lrow .c2,.lrow .c3{display:none}}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:#eee}
  .s-NEW{background:#dbeafe;color:#1e40af}
  .s-SHORTLISTED{background:#d1fae5;color:#065f46}
  .s-INTERVIEW_SCHEDULED,.s-INTERVIEWED{background:#fef3c7;color:#92400e}
  .s-PASSED{background:#16a34a;color:#fff}
  .s-KEEP_SCREENING,.s-KEEP_INTERVIEW{background:#ede9fe;color:#5b21b6}
  .s-REJECTED_SCREENING,.s-REJECTED_INTERVIEW{background:#fee2e2;color:#991b1b}

  /* side panel */
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;justify-content:flex-end;z-index:30}
  .panel{background:var(--bg);width:min(680px,100%);height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .phead{position:sticky;top:0;z-index:2;background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
  .phead h2{margin:0;font-size:17px;flex:1;font-weight:600}
  .pbody{padding:16px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px}
  .kv>div:nth-child(odd){color:var(--muted);font-size:13px;padding-top:2px}
  .kv a{color:var(--accent)}
  .files{display:flex;flex-wrap:wrap;gap:8px}
  .fbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border:1px solid #cbd2dc;border-radius:10px;background:#fff;color:var(--ink);font-size:14px;cursor:pointer;font-family:inherit;text-align:left;word-break:break-all;text-decoration:none}
  .fbtn:hover{border-color:var(--accent)}
  .fbtn .tag{font-size:11px;font-weight:700;color:#fff;background:#6b7280;border-radius:6px;padding:1px 6px;flex:none}
  .fbtn .tag.cv{background:#2563eb} .fbtn .tag.portfolio{background:#f26f21} .fbtn .tag.interview{background:#22aa96}
  .actions{display:flex;flex-wrap:wrap;gap:8px}
  .actform{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:14px;margin-top:12px}
  .actform .btns{display:flex;gap:8px;margin-top:6px}
  .tl{list-style:none;padding:0;margin:0}
  .tl li{padding:10px 0;border-top:1px dashed var(--line);font-size:14px;white-space:pre-wrap}
  .tl li:first-child{border-top:0}
  .tl .meta{color:var(--muted);font-size:12px;white-space:normal;margin-bottom:2px}
  .icard{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;font-size:14px}
  .icard .body{white-space:pre-wrap;margin:6px 0}
  table.users{width:100%;border-collapse:collapse;font-size:14px}
  table.users td{padding:10px 6px;border-top:1px solid var(--line);vertical-align:middle}
  table.users select{padding:8px;font-size:14px;width:auto}

  /* file viewer */
  .viewer{position:fixed;inset:0;z-index:50;background:#2b2926;display:flex;flex-direction:column}
  .vhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#111827;color:#fff}
  .vhead span{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vhead a,.vhead button{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer;text-decoration:none;font-family:inherit}
  .vbody{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
  .vbody canvas,.vbody img{display:block;margin:0 auto 12px;max-width:100%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .vbody iframe{width:100%;height:100%;border:0;background:#fff}
  .vbody .empty{color:#d1d5db}

  .busy{position:fixed;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:60;font-weight:700;font-size:15px;text-align:center;padding:20px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:70;font-size:14px;max-width:90vw}
</style>

<header class="appbar">
  <h1 data-i18n="app.title">Recruitment</h1>
  <div class="langsw">
    <button type="button" id="btnLangID" data-lang="id">ID</button>
    <button type="button" id="btnLangEN" data-lang="en">EN</button>
  </div>
  <button class="iconbtn hide" id="btnUsers" data-i18n="header.users">👥 Access</button>
  <button class="iconbtn hide" id="btnLogout" data-i18n="header.signout">Sign out</button>
</header>

<div class="wrap">

  <!-- LOGIN -->
  <section id="loginView" class="hide">
    <div class="card" style="max-width:420px;margin:8vh auto 0">
      <h2 class="section" data-i18n="login.title">Sign in</h2>
      <p class="muted" style="font-size:13px;margin:-6px 0 14px" data-i18n="login.confidential">Confidential — authorised staff only.</p>
      <div class="row"><label data-i18n="login.username">Username</label><input type="text" id="authUser" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="row"><label data-i18n="login.password">Password</label><input type="password" id="authPass" autocomplete="current-password"></div>
      <button class="btn proceed" id="btnAuthGo" data-i18n="login.signin_btn">Sign in</button>
      <div class="msg" id="authMsg"></div>
    </div>
  </section>

  <!-- NO ACCESS -->
  <section id="noAccessView" class="hide">
    <div class="card" style="max-width:460px;margin:8vh auto 0;text-align:center">
      <h2 class="section" data-i18n="noaccess.title">No access</h2>
      <p class="muted" data-i18n="noaccess.body">Your account doesn't have access to Recruitment. Ask an HR admin to add you.</p>
    </div>
  </section>

  <!-- LIST -->
  <section id="listView" class="hide">
    <div class="toolbar">
      <input type="search" id="q" data-i18n-ph="list.search" placeholder="Search name, phone, email, ID">
      <select id="fBrand"></select>
      <select id="fDept"></select>
      <select id="fPos"></select>
      <button class="btn small outline" id="btnRefresh" data-i18n="list.refresh">↻ Refresh</button>
      <button class="btn small add hide" id="btnAdd" data-i18n="list.add">+ Add candidate</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
  </section>
</div>
<div class="appfooter" id="appFooter"></div>

<div id="overlay" class="overlay hide"><div class="panel" id="panel"></div></div>

<div id="viewer" class="viewer hide">
  <div class="vhead"><span id="vName"></span><a id="vDl" data-i18n="viewer.download">Download</a><button id="vClose" data-i18n="common.close">Close</button></div>
  <div class="vbody" id="vBody"></div>
</div>

<div id="busy" class="busy hide"></div>
<div id="toast" class="toast hide"></div>

async function emailForUsername(u){
  if(u.indexOf("@")>0) return u.toLowerCase();
  var r=await sb.rpc("email_for_username",{u:u});
  if(r.error) throw r.error;
  return r.data;
}
async function doSignIn(){
  var u=$("authUser").value.trim(), p=$("authPass").value, m=$("authMsg");
  m.className="msg"; m.textContent="";
  if(!u||!p){ m.className="msg err"; m.textContent=t("login.err_enter_both"); return; }

  try{

  var pr=await sb.from("profiles").select("id,email,name,role,username,lang").eq("id",user.id).limit(1);

async function loadMeta(){

async function loadList(){
  $("list").innerHTML='<div class="empty">'+esc(t("list.loading"))+'</div>';
  try{
    var all=[], from=0, step=1000;
    while(true){
      var r=await sb.from("hr_candidates").select("id,name,phone,email,phone_norm,brand,department,position,status,created_at,interview_at")
        .order("created_at",{ascending:false}).range(from,from+step-1);
      if(r.error) throw r.error;
      all=all.concat(r.data||[]);
      if(!r.data || r.data.length<step) break;
      from+=step;
    }
    S.rows=all; render();
  }catch(e){ $("list").innerHTML='<div class="empty">'+esc(errMsg(e))+'</div>'; }

function render(){

function actionsFor(c){

    if(s!=="KEEP_SCREENING") a.push(["screening","KEEP_SCREENING",t("a.keep"),"outline"]);
    a.push(["screening","REJECTED_SCREENING",t("a.reject"),"outline red"]);
  }
  if(["SHORTLISTED","INTERVIEW_SCHEDULED","INTERVIEWED","KEEP_INTERVIEW"].indexOf(s)>=0 && can("schedule"))
    a.push(["schedule","",s==="SHORTLISTED"?t("a.schedule"):s==="INTERVIEW_SCHEDULED"?t("a.reschedule"):t("a.schedule_again"),s==="SHORTLISTED"?"proceed":"outline"]);
  if(s==="INTERVIEW_SCHEDULED" && can("record")) a.push(["record","",t("a.record"),"proceed"]);
  if(["INTERVIEW_SCHEDULED","INTERVIEWED","KEEP_INTERVIEW"].indexOf(s)>=0 && can("decide")){
    a.push(["decide","PASSED",t("a.pass"),s==="INTERVIEWED"?"proceed":"outline"]);
    if(s!=="KEEP_INTERVIEW") a.push(["decide","KEEP_INTERVIEW",t("a.keep"),"outline"]);
    a.push(["decide","REJECTED_INTERVIEW",t("a.reject"),"outline red"]);
  }
  if(s!=="NEW" && can("reopen")) a.push(["reopen","NEW",t("a.reopen"),"outline"]);
  if(can("comment")) a.push(["comment","",t("a.comment"),"outline"]);

  if(can("del")) a.push(["delete","",t("a.delete"),"outline red"]);
  return a;
}

async function submitForm(kind,to){
  var id=S.current.c.id, cm=($("fCm")||{}).value||"", err=$("fErr"), go=$("fGo");
  err.textContent=""; go.disabled=true;
  try{
    if(kind==="screening") await rpc("hr_screening",{p_id:id,p_to:to,p_comment:cm});
    else if(kind==="decide") await rpc("hr_interview_decision",{p_id:id,p_to:to,p_comment:cm});
    else if(kind==="reopen") await rpc("hr_reopen",{p_id:id,p_comment:cm});
    else if(kind==="comment") await rpc("hr_comment",{p_id:id,p_comment:cm});
    else if(kind==="schedule"){
      var dt=$("fDate").value, tm=$("fTime").value;
      if(!dt||!tm) throw new Error(t("a.err_date"));
      await rpc("hr_schedule",{p_id:id,p_at:new Date(dt+"T"+tm+":00+07:00").toISOString(),p_interviewer:$("fWho").value,p_location:$("fLoc").value,p_comment:cm});
    }
    else if(kind==="record"){
      var rf=[].slice.call($("fFile").files); checkSizes(rf);
      busy();
      var iid=await rpc("hr_record_interview",{p_id:id,p_recommendation:$("fRec").value,p_comment:cm});
      var failed=await uploadFiles(id,"interview",rf,iid);
      if(failed.length) alert(t("add.upload_fail")+"\n\n"+failed.join("\n"));
    }
    else if(kind==="files"){
      var ff=[].slice.call($("fFile").files); if(!ff.length) throw new Error(t("a.err_nofiles")); checkSizes(ff);
      var k=$("fKind").value, iv=null;
      if(k==="interview"){ var last=S.current.interviews[S.current.interviews.length-1]; iv=last?last.id:null; }
      busy();
      var fl=await uploadFiles(id,k,ff,iv);
      if(fl.length) alert(t("add.upload_fail")+"\n\n"+fl.join("\n"));
    }
    else if(kind==="delete"){
      busy();
      var paths=await rpc("hr_delete_candidate",{p_id:id,p_reason:cm})||[];
      var gd=paths.filter(function(p){ return /^gdrive:/.test(p); }), st=paths.filter(function(p){ return !/^gdrive:/.test(p); });
      if(st.length) await sb.storage.from(BUCKET).remove(st);
      if(gd.length){ try{ await bridge("trash",{candidateId:id,paths:gd}); }catch(e){ alert("Candidate deleted, but some Drive files could not be moved to Bin: "+e.message); } }
      busy(false); closePanel(); toast(t("a.deleted")); loadList(); return;
    }
    busy(false); toast(t("a.saved"));
    await openCandidate(id);
    loadList();
  }catch(e){ busy(false); if($("fErr")) $("fErr").textContent=errMsg(e); if($("fGo")) $("fGo").disabled=false; }
}

/* ---------------- uploads ---------------- */
function checkSizes(files){
  var total=0;
  files.forEach(function(f){ if(f.size>MAX_MB*1048576) throw new Error(f.name+" > "+MAX_MB+" MB"); total+=f.size; });
  if(total>MAX_TOTAL_MB*1048576) throw new Error("Total > "+MAX_TOTAL_MB+" MB");
}
// Uploads each file (Google Drive via the bridge, or Supabase Storage), then registers it. Returns names that failed.
async function uploadFiles(cid, kind, files, interviewId){
  var failed=[];
  for(var i=0;i<files.length;i++){
    var f=files[i];
    busy(t("common.uploading")+" "+(i+1)+"/"+files.length+"…\n"+f.name);
    try{
      if(DRIVE_BRIDGE_URL){
        await bridge("upload",{candidateId:cid,kind:kind,name:f.name,mime:f.type||null,size:f.size,interviewId:interviewId||null,data:await readB64(f)});
      }else{
        var path=cid+"/"+kind+"-"+Date.now()+"-"+i+"-"+safeKey(f.name);
        var up=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||"application/octet-stream",upsert:false});
        if(up.error) throw up.error;
        await rpc("hr_add_file",{p_candidate:cid,p_kind:kind,p_name:f.name,p_path:path,p_size:f.size,p_mime:f.type||null,p_interview:interviewId||null});
      }
    }catch(e){ failed.push(f.name+" — "+errMsg(e)); }
  }
  return failed;
}
function readB64(file){
  return new Promise(function(res,rej){ var r=new FileReader();
    r.onload=function(){ res(String(r.result).split(",")[1]||""); };
    r.onerror=function(){ rej(new Error("Could not read "+file.name)); };
    r.readAsDataURL(file); });
}
// Calls the Apps Script Drive bridge with the user's Supabase login token.
// Plain-text POST = no CORS preflight, which Apps Script can't answer.
async function bridge(action, payload){
  var s=await sb.auth.getSession();
  var tok=s.data && s.data.session && s.data.session.access_token;
  if(!tok){ toast(t("common.session")); signOut(); throw new Error(t("common.session")); }
  var body=JSON.stringify(Object.assign({action:action,token:tok},payload)), j=null, why="";
  // Google can drop or slow the first request after the bridge has been idle/redeployed: retry up to 3 times.
  for(var attempt=1; attempt<=3 && !j; attempt++){
    try{
      var res=await fetch(DRIVE_BRIDGE_URL,{method:"POST",body:body});
      var txt=await res.text();
      try{ j=JSON.parse(txt); }catch(pe){ why="HTTP "+res.status+" (unexpected reply from Google)"; }
    }catch(e){ why=(e&&e.message)||String(e); }
    if(!j && attempt<3) await new Promise(function(r){ setTimeout(r, attempt*2000); });
  }
  if(!j) throw new Error("Google Drive is not reachable ("+why+"). Please try again in a minute.");
  if(!j.ok){ if(/sign in again/i.test(j.error||"")){ toast(t("common.session")); signOut(); } throw new Error(j.error||"Google Drive error"); }
  return j.data;
}

async function findDuplicates(phone,email){
  var out={}, pn=normPhone(phone), em=String(email||"").trim().toLowerCase();
  var qs=[];
  if(pn.length>=8) qs.push(sb.from("hr_candidates").select("id,name,brand,position,status,created_at").eq("phone_norm",pn));
  if(em) qs.push(sb.from("hr_candidates").select("id,name,brand,position,status,created_at").eq("email",em));
  var rs=await Promise.all(qs);
  rs.forEach(function(r){ (r.data||[]).forEach(function(x){ out[x.id]=x; }); });
  return Object.keys(out).map(function(k){ return out[k]; });
}
async function submitAdd(){

         position:$("aPos").value,source:$("aSrc").value,portfolio_link:$("aLink").value.trim(),notes:$("aNotes").value.trim()};
  var cv=[].slice.call($("aCv").files), pf=[].slice.call($("aPf").files);
  try{
    if(!d.name||!d.brand||!d.department||!d.position) throw new Error(t("add.err_fill"));
    if(!cv.length&&!pf.length&&!d.portfolio_link) throw new Error(t("add.err_files"));

      busy(false);

      if(!confirm(t("add.dup")+"\n\n"+list+"\n\n"+t("add.dup_q"))){ $("aGo").disabled=false; return; }
      busy();
    }
    var id=await rpc("hr_create_candidate",{p:d});
    var failed=(await uploadFiles(id,"cv",cv,null)).concat(await uploadFiles(id,"portfolio",pf,null));
    busy(false);
    if(failed.length) alert(t("add.upload_fail")+"\n\n"+failed.join("\n")); else toast(t("add.saved")+" ("+id+")");
    loadList();
    openCandidate(id);
  }catch(e){ busy(false); err.textContent=errMsg(e); if($("aGo")) $("aGo").disabled=false; }
}

/* ---------------- in-app file viewer ---------------- */
var viewSeq=0, viewUrl=null;
async function viewFile(fileId){
  var f=S.current && S.current.files.filter(function(x){ return x.id===fileId; })[0];
  if(!f) return;
  busy();
  try{
    var blob;
    if(/^gdrive:/.test(f.path)){
      var d=await bridge("view",{fileId:f.id});   // the bridge logs the view
      blob=b64ToBlob(d.data, d.mime||f.mime||"application/octet-stream");
    }else{
      await rpc("hr_log_view",{p_file:f.id});
      var r=await sb.storage.from(BUCKET).download(f.path);
      if(r.error) throw r.error;
      blob=r.data;
    }
    busy(false);
    showViewer(f, blob);
  }catch(e){ busy(false); toast(errMsg(e)); }
}
function b64ToBlob(d,type){ var bin=atob(d), arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:type}); }
function showViewer(f, blob){
  var seq=++viewSeq, type=f.mime||blob.type||"";
  if(viewUrl) URL.revokeObjectURL(viewUrl);
  viewUrl=URL.createObjectURL(blob);
  $("vName").textContent=f.name; $("vDl").href=viewUrl; $("vDl").download=f.name;
  var body=$("vBody"); body.innerHTML="";
  $("viewer").classList.remove("hide");
  if(/^image\/(jpe?g|png|webp|gif)$/i.test(type)){
    var img=new Image(); img.alt="";
    img.onerror=function(){ if(seq===viewSeq) body.innerHTML='<div class="empty">'+esc(t("viewer.nopreview"))+'</div>'; };
    img.src=viewUrl; body.appendChild(img);
  }
  else if(type==="application/pdf"||/\.pdf$/i.test(f.name)) renderPdf(blob,body,seq);
  else body.innerHTML='<div class="empty">'+esc(t("viewer.nopreview"))+'</div>';
}
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  return new Promise(function(res,rej){
    var s=document.createElement("script"); s.src=PDFJS+"pdf.min.js";
    s.onload=function(){ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js"; res(); };
    s.onerror=function(){ rej(new Error("pdf.js")); };
    document.head.appendChild(s);
  });
}
async function renderPdf(blob,body,seq){
  body.innerHTML='<div class="empty">'+esc(t("viewer.loading"))+'</div>';
  try{
    await loadPdfJs();
    var pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
    if(seq!==viewSeq) return;
    body.innerHTML="";
    var w=Math.min(body.clientWidth-24,900), dpr=window.devicePixelRatio||1;
    for(var p=1;p<=pdf.numPages;p++){
      if(seq!==viewSeq) return;
      var page=await pdf.getPage(p), base=page.getViewport({scale:1}), vp=page.getViewport({scale:(w/base.width)*dpr});
      var cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height; cv.style.width=w+"px";
      body.appendChild(cv);
      await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    }
  }catch(e){ if(seq===viewSeq) body.innerHTML='<iframe src="'+viewUrl+'"></iframe>'; }
}
function closeViewer(){ viewSeq++; $("viewer").classList.add("hide"); $("vBody").innerHTML=""; if(viewUrl){ URL.revokeObjectURL(viewUrl); viewUrl=null; } }
